<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectTI Soluções em Tecnologia</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <main>
        <!-- Form de Cadastro / Edição -->
        <section class="container">
            <h2 id="form-title">Cadastrar Chamado</h2>
            <form class="form" id="form-chamado">
                <input type="hidden" id="edit-id" value="">

                <label for="nomesolicitante">Nome do Solicitante:</label>
                <input type="text" id="nomesolicitante" placeholder="Digite o nome" required>

                <label for="descricao">Descrição:</label>
                <input type="text" id="descricao" placeholder="Digite a descrição" required>

                <label for="categoria">Categoria:</label>
                <input type="text" id="categoria" placeholder="Ex: Redes, Hardware, Software" required>

                <label for="prioridade">Prioridade:</label>
                <select id="prioridade" name="prioridade">
                    <option value="Baixa">Baixa</option>
                    <option value="Média">Média</option>
                    <option value="Alta">Alta</option>
                </select>

                <label for="status">Status:</label>
                <select id="status" name="status">
                    <option value="Aberto">Aberto</option>
                    <option value="Em atendimento">Em atendimento</option>
                    <option value="Concluído">Concluído</option>
                </select>

                <label for="data">Data de Abertura:</label>
                <input type="date" id="data" required>

                <div class="form-actions">
                    <button type="submit" id="cadastrar-chamado">Salvar Chamado</button>
                    <button type="button" id="cancelar-edicao" style="display: none;">Cancelar</button>
                </div>
            </form>
        </section>

        <!-- Listagem e Busca -->
        <section class="container">
             <div class="linha-container">
                <button id="load-chamados">Carregar Chamados</button>
                <div class="filter-box">
                    <input type="text" id="filterInput" placeholder="Filtrar por solicitante ou categoria...">
                </div>
             </div>
             
             <div id="chamado-list" class="lista-chamados">
                <p>Carregue os chamados para visualizar.</p>
             </div>
        </section>
    </main>

    <script src="index.js"></script>
</body>
</html>
